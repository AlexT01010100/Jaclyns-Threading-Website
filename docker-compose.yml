services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: jaclyns-threading-db
    restart: unless-stopped
    environment:
      # IMPORTANT: any value in .env containing a literal "$" - most notably
      # ADMIN_PASSWORD_HASH, which is a bcrypt hash and *always* contains "$" -
      # must have every "$" written as "$$" in .env. Compose parses .env
      # values for $VAR-style references (so other .env entries can build on
      # each other) regardless of whether the value reaches a container via
      # this ${...} interpolation or via an env_file: list below; an
      # unescaped "$word" is treated as a reference to an undefined variable
      # and silently deleted, corrupting the value. Verify with:
      # docker exec jaclyns-threading-db env | grep POSTGRES_PASSWORD
      # docker exec jaclyns-threading-app env | grep ADMIN_PASSWORD_HASH
      POSTGRES_DB: ${DB_NAME:-jaclyns_threading}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jaclyns-threading-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Loads every var from .env with its name unchanged (DB_NAME, DB_USER,
    # DB_PASSWORD, ADMIN_PASSWORD_HASH, SESSION_SECRET, etc. all match what
    # server.js reads via process.env), instead of repeating every name via
    # ${...} below. NOTE: this does NOT avoid the "$" escaping requirement -
    # see the comment on the db service above. Any "$" in a value here must
    # still be written as "$$" in .env.
    env_file:
      - .env
    environment:
      # Compose-specific overrides that must differ from .env regardless of
      # its contents - none of these can contain "$", so plain interpolation
      # is fine here. NODE_ENV defaults to production (the safe choice for a
      # real deploy) but still honors .env's value if it sets one - this
      # matters for local testing, since NODE_ENV=development is what makes
      # session cookies work without HTTPS. A hardcoded "production" here
      # would silently override .env.local.example's "development" and admin
      # login would look like it works but never actually set a cookie.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    # Uncomment volumes below for development mode
    # volumes:
    #   - ./public:/app/public
    #   - ./server-sql.js:/app/server-sql.js

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
